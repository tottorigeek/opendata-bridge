name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        # contributor-assistant/github-action v2.6.1 を SHA で固定
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/version1/cla.json
          path-to-document: https://github.com/tottorigeek/opendata-bridge/blob/main/CLA.md
          # main はブランチ保護(PR 必須)のため署名ファイルを直接コミットできない。
          # 署名記録は保護なしの専用ブランチに置く。
          branch: cla-signatures
          # PR 作成者ではなく「コミットの著者」が照合される点に注意。
          allowlist: sekir-yamata,tottorigeek,bot*,dependabot[bot]
          custom-notsigned-prcomment: |
            PR ありがとうございます。マージの前に [CLA.md](https://github.com/tottorigeek/opendata-bridge/blob/main/CLA.md)(貢献者ライセンス同意書)への署名をお願いしています。
            著作権はあなたに残ります。内容をご確認のうえ、下記の文言をこの PR にコメントしてください。
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-allsigned-prcomment: 署名を確認しました。ありがとうございます。
